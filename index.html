<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101716" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lifelyn">
<title>Lifelyn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: grouped sidebar (desktop), icon rail (tablet), five-tab bottom bar (phone). Warm paper surfaces, one deep teal, terracotta used once per screen. */
:root{
 --bg:#FAF8F4;--surface:#FFFFFF;--sunken:#F3EFE8;--line:#E5DFD4;--line-strong:#8A918C;
 --t1:#1C2526;--t2:#4A5758;--t3:#5E6B6B;
 --primary:#0E6F66;--primary-h:#0B5A53;--primary-soft:#DDF0EC;--on-primary:#FFFFFF;
 --accent:#A93C22;--accent-soft:#FBE6DD;
 --ok:#1B7A43;--ok-soft:#E0F2E7;--warn:#8A5100;--warn-soft:#FFF1D6;--err:#C2352B;--err-soft:#FCE4E1;
 --focus:#1D5FD1;--shadow:0 8px 30px rgba(28,37,38,.14);
 --f-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--f-display:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#101716;--surface:#172120;--sunken:#0B1110;--line:#2B3A39;--line-strong:#6E807D;
 --t1:#EAF1EF;--t2:#B4C2BF;--t3:#8FA19E;
 --primary:#4FC3B4;--primary-h:#6FD3C6;--primary-soft:#12312E;--on-primary:#06201D;
 --accent:#F08A6B;--accent-soft:#3A2119;
 --ok:#5BD08A;--ok-soft:#12301F;--warn:#F2B84B;--warn-soft:#37290A;--err:#FF8A80;--err-soft:#3D1816;
 --focus:#8CB8FF;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#101716;--surface:#172120;--sunken:#0B1110;--line:#2B3A39;--line-strong:#6E807D;
 --t1:#EAF1EF;--t2:#B4C2BF;--t3:#8FA19E;
 --primary:#4FC3B4;--primary-h:#6FD3C6;--primary-soft:#12312E;--on-primary:#06201D;
 --accent:#F08A6B;--accent-soft:#3A2119;
 --ok:#5BD08A;--ok-soft:#12301F;--warn:#F2B84B;--warn-soft:#37290A;--err:#FF8A80;--err-soft:#3D1816;
 --focus:#8CB8FF;--shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,select,input,.chip{touch-action:manipulation}
img,svg,video{max-width:100%}
body{overflow-x:hidden;overscroll-behavior-y:none}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h1{font-size:1.75rem;line-height:2.25rem;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.125rem;line-height:1.6rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
.small{font-size:.875rem;line-height:1.25rem}.cap{font-size:.8125rem;line-height:1.1rem}
.muted{color:var(--t2)}.faint{color:var(--t3)}
.disp{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{flex:none}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;height:100dvh;background:var(--sunken);border-right:1px solid var(--line);padding:20px 12px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.mark{width:30px;height:30px;border-radius:9px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.grp{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);font-weight:600;padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:8px 10px;border:0;border-radius:10px;background:none;color:var(--t2);font-weight:500;text-align:left}
.nav:hover{background:var(--line)}
.nav[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;font-size:.75rem;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-weight:600}
:root[data-theme="dark"] .badge{color:#101716}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#101716}}
.sp{flex:1}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap>*{min-width:0}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.top .t{min-width:0}
.tools{display:flex;gap:8px;align-items:center}
.bottom{display:none}
@media (max-width:1023px){
 .app{grid-template-columns:76px minmax(0,1fr)}
 .side{padding:16px 8px;align-items:stretch}
 .side .grp,.brand span:last-child{display:none}
 .nav{flex-direction:column;gap:2px;justify-content:center;font-size:.72rem;padding:8px 2px;text-align:center}
 .brand{justify-content:center;padding:4px 0 12px}
 .badge{position:absolute;margin:0;transform:translate(14px,-14px)}
 .nav{position:relative}
}
@media (max-width:599px),(max-height:500px) and (max-width:1023px){
 .app{display:block}
 .side{display:none}
 .wrap{padding-block:12px 110px}
 .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
 .bottom .nav{flex-direction:column;gap:2px;justify-content:center;font-size:.72rem;min-height:52px;padding:4px 0;text-align:center;position:relative}
 h1{font-size:1.5rem;line-height:2rem}
 .sheet{border-radius:20px 20px 0 0}
}
@media (max-height:500px) and (orientation:landscape){
 .bottom .nav{min-height:44px;flex-direction:row;justify-content:center;gap:6px;font-size:.75rem}
 .wrap{padding-block:8px 72px}.scrim .sheet{max-height:96dvh}
}
@media (max-width:359px){
 .btn{padding:0 12px}.card{padding:12px}.item{padding:8px 10px;gap:8px}.hello{font-size:1.5rem;line-height:2rem}.chip{padding:0 10px}
 .bottom .nav{font-size:.66rem}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flush{padding:0;overflow:hidden}
.card h2{margin-bottom:8px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.shead h2{margin:0}
.link{background:none;border:0;color:var(--primary);font-weight:600;padding:6px 4px;min-height:36px;border-radius:8px}
.link:hover{text-decoration:underline}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:899px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px}
.rowf{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:.9375rem}
.btn:hover{background:var(--sunken)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.pri:hover{background:var(--primary-h)}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:.875rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--t2)}
.ibtn:hover{background:var(--sunken)}
.ibtn.sm{width:36px;height:36px;border-radius:10px;border-color:transparent;background:none}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);font-size:.875rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--sunken);color:var(--t2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.err{background:var(--err-soft);color:var(--err)}.pill.pri{background:var(--primary-soft);color:var(--primary)}.pill.acc{background:var(--accent-soft);color:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.875rem;font-weight:500}
.in{min-height:44px;width:100%;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface)}
.in::placeholder{color:var(--t3)}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:22px;height:22px;accent-color:var(--primary)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
@media (max-width:480px){.formgrid{grid-template-columns:1fr}}

.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:56px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .tt{font-weight:500;overflow-wrap:anywhere}
.item.done .tt{text-decoration:line-through;color:var(--t3)}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;color:transparent;flex:none;padding:0}
.tick[aria-checked="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.tickwrap{width:44px;height:44px;display:grid;place-items:center;margin:-8px -8px -8px -10px;background:none;border:0;flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--t2)}
.empty .disp{font-size:1.15rem;color:var(--t1);margin-bottom:4px}
.strip{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--err-soft);color:var(--err);border:1px solid var(--err);text-align:left;width:100%}
.strip .tx{color:var(--t1);flex:1;min-width:0}
.strip b{color:var(--err)}

.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .35s ease}
.bar.over i{background:var(--err)}
.rm .bar i,.rm *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.bar i,*{transition:none!important;animation:none!important}}
.big{font-size:2rem;line-height:2.4rem;font-weight:650;letter-spacing:-.02em}
.hero{display:flex;flex-direction:column;gap:10px}
.hello{font-size:2.1rem;line-height:2.6rem}
@media (max-width:599px){.hello{font-size:1.75rem;line-height:2.2rem}}
.ask{display:flex;gap:8px;align-items:center;background:var(--primary-soft);border:1px solid var(--primary);border-radius:99px;padding:4px 4px 4px 16px}
.ask input{flex:1;min-width:0;border:0;background:none;min-height:40px;outline:none;color:var(--t1)}
.ask input::placeholder{color:var(--t2)}
.ask:focus-within{outline:2px solid var(--focus);outline-offset:2px}

.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;color:var(--t2);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.75rem;color:var(--t3);text-align:center;font-weight:600;padding:4px 0}
.cell{min-height:64px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 6px;text-align:left;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.cell:hover{background:var(--sunken)}
.cell.out{opacity:.45}
.cell.today .dn{background:var(--primary);color:var(--on-primary)}
.cell[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.dn{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8125rem;font-weight:600}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}.dot.r{background:var(--accent)}.dot.t{background:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wcol{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;min-height:140px;display:flex;flex-direction:column;gap:6px}
.wcol.today{border-color:var(--primary)}
.ev{font-size:.8125rem;line-height:1.15rem;padding:4px 6px;border-radius:7px;background:var(--primary-soft);color:var(--t1);overflow-wrap:anywhere}
.ev.r{background:var(--accent-soft)}.ev.t{background:var(--warn-soft)}.ev.d{text-decoration:line-through;opacity:.6}
@media (max-width:760px){.week{grid-template-columns:1fr}.wcol{min-height:0}}
@media (max-width:480px){.cell{min-height:52px;padding:3px}.dots{gap:2px}}

.msgs{display:flex;flex-direction:column;gap:12px;min-height:280px}
.m{max-width:min(620px,92%);padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.prop{align-self:flex-start;width:min(560px,100%);border:1.5px dashed var(--primary);background:var(--primary-soft);border-radius:14px;padding:12px 14px}
.prop.applied{border-style:solid;background:var(--ok-soft);border-color:var(--ok)}
.prop.rejected,.prop.undone{border-color:var(--line-strong);background:var(--sunken);opacity:.8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:6px 0 10px}
.kv dt{color:var(--t2)}.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.sugg{display:flex;gap:8px;flex-wrap:wrap}
.think{display:inline-flex;gap:4px}.think i{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:b 1s infinite ease-in-out}.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
.compose{position:sticky;bottom:0;background:var(--bg);padding:8px 0 4px}
@media (max-width:599px){.compose{bottom:76px;bottom:calc(72px + env(safe-area-inset-bottom,0px))}}

.cats .crow{display:grid;grid-template-columns:minmax(110px,1.2fr) minmax(0,2fr) 96px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cats .crow:first-child{border-top:0}
.cats .alloc{width:96px;min-height:36px}
@media (max-width:599px){.cats .crow{grid-template-columns:1fr 96px}.cats .crow .bar{grid-column:1/-1;order:3}}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--primary)}.chart .b.today{fill:var(--accent)}.chart text{fill:var(--t3);font-size:10px}.chart line{stroke:var(--line)}
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.neg{color:var(--t1)}.amt.pos{color:var(--ok)}
.tripcard{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tripcard:hover{border-color:var(--primary)}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat>div{background:var(--sunken);border-radius:12px;padding:12px}
.stat .v{font-size:1.25rem;font-weight:650;font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);background:rgba(10,16,15,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;max-height:92dvh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--t1);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;min-height:32px}
@media (min-width:600px){.toast{bottom:24px}}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 0;border-top:1px solid var(--line)}
.sw:first-of-type{border-top:0}
.sw button[role="switch"]{width:48px;height:28px;border-radius:99px;border:1px solid var(--line-strong);background:var(--sunken);position:relative;flex:none;padding:0}
.sw button[role="switch"]::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--t2);transition:transform .15s}
.sw button[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.sw button[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-primary)}
.note{font-size:.8125rem;color:var(--t2);background:var(--sunken);border-radius:10px;padding:8px 12px}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:14px}
.nested{margin-left:20px;border-left:2px solid var(--line)}
.map{height:min(340px,52vh);min-height:220px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:var(--sunken);z-index:0;position:relative}
.leaflet-container{font:inherit}
.ev.m{background:var(--warn-soft)}
details summary{list-style:revert}
a.btn{text-decoration:none;color:inherit}
</style>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:16px}[hidden]{display:none!important}</style>
</head>
<body>
<div id="root"></div>
<noscript>Lifelyn needs JavaScript to run.</noscript>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="config.js"></script>
<script>
const {useState,useEffect,useMemo,useRef}=React;
const html=htm.bind(React.createElement);

/* ---------- dates, money ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=(s,o)=>parse(s).toLocaleDateString('en-GB',o);

/* ---------- assistant: local rule-based parser (not Claude) ---------- */
const WD=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function pDate(t){t=t.toLowerCase();const T=today();
 if(/\btoday\b|\btonight\b/.test(t))return T;if(/\btomorrow\b/.test(t))return addDays(T,1);
 let m=t.match(/\bin (\d+) days?\b/);if(m)return addDays(T,+m[1]);if(/\bnext week\b/.test(t))return addDays(T,7);
 m=t.match(/\b(sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
 if(m){let d=(WD.indexOf(m[1])-parse(T).getDay()+7)%7;if(d===0)d=7;return addDays(T,d)}return null}
function pTime(t){const m=t.toLowerCase().match(/\bat (\d{1,2})(?::(\d{2}))?\s?(am|pm)?\b/);if(!m)return null;let h=+m[1];if(m[3]==='pm'&&h<12)h+=12;if(m[3]==='am'&&h===12)h=0;if(h>23)return null;return pad(h)+':'+(m[2]||'00')}
function pAmt(t){const m=t.match(/[£₦€$]\s?(\d[\d,]*(?:\.\d+)?)/)||t.match(/(\d[\d,]*(?:\.\d+)?)\s?(?:pounds|quid|gbp|naira|euros?|dollars?)\b/i);return m?parseFloat(m[1].replace(/,/g,'')):null}
function pCat(t){t=t.toLowerCase();
 if(/flight|airline/.test(t))return 'Flights';if(/hotel|stay|airbnb|room/.test(t))return 'Stay';
 if(/taxi|uber|bolt|transfer|parking|fuel|petrol|train|bus/.test(t))return 'Transport';
 if(/food|lunch|dinner|breakfast|restaurant|coffee|groceries|snack/.test(t))return 'Food';
 if(/gift|present|shop|souvenir/.test(t))return 'Gifts & shopping';
 if(/suit|dress|outfit|tailor|fabric|shoes|aso/.test(t))return 'Outfits';return 'Other'}
function clean(t){let s=t.replace(/[£₦€$]\s?\d[\d,]*(\.\d+)?/g,'').replace(/\d[\d,]*(\.\d+)?\s?(pounds|quid|gbp|naira|euros?|dollars?)\b/gi,'')
 .replace(/\bat \d{1,2}(:\d{2})?\s?(am|pm)?\b/gi,'').replace(/\b(today|tonight|tomorrow|next week|in \d+ days?|on (sunday|monday|tuesday|wednesday|thursday|friday|saturday)|(sunday|monday|tuesday|wednesday|thursday|friday|saturday))\b/gi,'')
 .replace(/^\s*(please\s+)?(can you\s+)?(add|create|new|make|set|log|remind me to|remind me|i need to|i have to|i must|task:?|todo:?|a task to|task to|spent|paid|bought|received|got)\s+(a\s+|an\s+|the\s+)?/i,'')
 .replace(/^(a\s+)?(task|todo)\s*(to|:)?\s*/i,'').replace(/^(on|for|to)\s+/i,'').replace(/\s+/g,' ').trim();return s?s[0].toUpperCase()+s.slice(1):''}
function interpret(text,S){
 const t=text.trim(),l=t.toLowerCase(),T=today(),cur=S.settings.currency;
 const open=S.tasks.filter(x=>!x.done);
 if(/remind/.test(l)){const title=clean(t)||'Reminder';const d=pDate(t)||T;const tm=pTime(t)||'09:00';
  return {text:'I can set this reminder. Check the details and approve it.',proposals:[{kind:'reminder',data:{title,date:d,time:tm,repeat:/every day|daily/.test(l)?'daily':/every week|weekly/.test(l)?'weekly':'none',important:false}}]}}
 const amt=pAmt(t);
 if(amt!=null&&/(received|got paid|salary|income|earned|refund)/.test(l))return {text:'I can log this income.',proposals:[{kind:'tx',data:{type:'income',title:clean(t)||'Income',amount:amt,cat:'Income',date:pDate(t)||T}}]};
 if(amt!=null&&/(spent|paid|bought|cost|pay|expense)/.test(l)){const title=clean(t)||'Expense';return {text:'I can add this expense. It will count against your '+pCat(t)+' budget.',proposals:[{kind:'tx',data:{type:'expense',title,amount:amt,cat:pCat(t),date:pDate(t)||T}}]}}
 if(/overdue|late|behind/.test(l)){const od=open.filter(x=>x.due<T);return {text:od.length?'You have '+od.length+' overdue:\n'+od.map(x=>'• '+x.title+' ('+rel(x.due)+')').join('\n'):'Nothing is overdue.'}}
 if(/(what|show|list).*(today|due|on)|today.*(task|due)|my day/.test(l)){const d=pDate(t)||T;const tk=open.filter(x=>x.due===d);const rm=S.reminders.filter(r=>!r.done&&r.date===d);
  return {text:(tk.length+rm.length)?rel(d)+':\n'+tk.map(x=>'• '+x.title).concat(rm.map(r=>'• '+r.time+' '+r.title+' (reminder)')).join('\n'):'Nothing planned for '+rel(d).toLowerCase()+'.'}}
 const cmd=/^\s*(please\s+)?(add|create|new|make|set|log)\b|\btask\b/.test(l);
 if(!cmd&&/budget|left|spend|spent|money|afford/.test(l)){const tot=sum(Object.values(S.alloc)),sp=sum(S.expenses.filter(e=>e.type==='expense').map(e=>e.amount));
  const unpaid=sum(S.trips.flatMap(x=>x.bookings).filter(b=>!b.paid).map(b=>b.cost));
  return {text:'Budget '+money(tot,cur)+', spent '+money(sp,cur)+', left '+money(tot-sp,cur)+'.\nBookings still to pay: '+money(unpaid,cur)+', which leaves '+money(tot-sp-unpaid,cur)+' once they are paid.'}}
 if(!cmd&&/trip|wedding|lagos|travel|flight/.test(l)){const x=S.trips[0];if(!x)return {text:'You have no trips yet. Add one in Travel.'};
  const un=x.bookings.filter(b=>!b.paid);return {text:x.name+' is in '+diff(x.start,T)+' days. '+x.checklist.filter(c=>c.done).length+' of '+x.checklist.length+' checklist items are done.\nStill to pay: '+money(sum(un.map(b=>b.cost)),cur)+(un.length?' ('+un.map(b=>b.title).join(', ')+')':'.')}}
 const pj=S.projects.find(p=>p.status==='active'&&l.includes(p.name.toLowerCase()));
 const pm=l.match(/(?:new|create|start|add)\s+(?:a\s+)?project\s*(?:called|named|for|:)?\s*(.+)/);
 if(pm&&pm[1].trim().length>1){const nm=t.slice(l.indexOf(pm[1])).trim();return {text:'I can create this project. You can add tasks and milestones after.',proposals:[{kind:'project',data:{name:nm[0].toUpperCase()+nm.slice(1),desc:'',deadline:pDate(t)||''}}]}}
 if(/\bprojects?\b/.test(l)){const ps=S.projects.filter(p=>p.status==='active');return {text:ps.length?'Active projects:\n'+ps.map(p=>'• '+p.name+' ('+pprog(S,p)+'%'+(p.deadline?', due '+rel(p.deadline):'')+')').join('\n'):'You have no active projects.'}}
 let title=clean(t);if(pj)title=title.replace(new RegExp('\\s*(to|in|for|on)\\s+(the\\s+)?'+pj.name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'.*$','i'),'').trim()||title;
 if(title&&title.length>2&&/(add|create|new|task|todo|need to|have to|must|buy|call|book|pay|send|pick|collect|renew|email|submit)/.test(l))
  return {text:'I can add this task.',proposals:[{kind:'task',data:{title,due:pDate(t)||T,priority:/urgent|asap|important/.test(l)?'high':'med',amount:amt,project:pj?pj.id:undefined}}]};
 return {text:"I didn't catch that. Try \"add task buy gifts on friday\", \"spent £20 on lunch\", \"remind me to call Aunty tomorrow at 6pm\", or ask \"what's due today?\"."}}

  <div className="hd"><h2>${title}</h2><button className="ibtn sm" onClick=${onClose} aria-label="Close"><${Ic} n="x"/></button></div>${children}</div></div>`}
function Form({fields,initial,submit,onSubmit,onCancel}){
 const [v,setV]=useState(()=>({...Object.fromEntries(fields.map(f=>[f.k,f.type==='checkbox'?false:f.options?f.options[0][0]:''])),...initial}));

 return html`<form className="stack" onSubmit=${e=>{e.preventDefault();onSubmit(v)}}><div className="formgrid">${fields.map(f=>html`
  <div key=${f.k} className=${'field'+(f.full?' full':'')}>
  ${f.type==='checkbox'?html`<label className="chk"><input type="checkbox" id=${'f-'+f.k} checked=${!!v[f.k]} onChange=${e=>set(f.k,e.target.checked)}/> ${f.label}</label>`:html`
   <label htmlFor=${'f-'+f.k}>${f.label}</label>
   ${f.options?html`<select id=${'f-'+f.k} className="in" value=${v[f.k]} onChange=${e=>set(f.k,e.target.value)}>${f.options.map(o=>html`<option key=${o[0]} value=${o[0]}>${o[1]}</option>`)}</select>`
   :f.type==='textarea'?html`<textarea id=${'f-'+f.k} className="in" style=${{minHeight:90,padding:10}} value=${v[f.k]} onChange=${e=>set(f.k,e.target.value)}></textarea>`
   :html`<input id=${'f-'+f.k} className="in" type=${f.type||'text'} step=${f.type==='number'?'0.01':undefined} min=${f.type==='number'?'0':undefined} required=${!!f.req} placeholder=${f.ph||''} value=${v[f.k]} onChange=${e=>set(f.k,e.target.value)}/>`}`}
  </div>`)}</div>
  <div className="rowf"><button type="submit" className="btn pri">${submit}</button><button type="button" className="btn" onClick=${onCancel}>Cancel</button></div></form>`}

 ...S.projects.filter(p=>p.status==='active').flatMap(p=>[...(p.milestones||[]).filter(m=>m.date===d).map(m=>({k:'m',id:m.id,title:'Milestone: '+m.title+' ('+p.name+')',done:m.done,time:''})),...(p.deadline===d?[{k:'m',id:p.id+'dl',title:'Project deadline: '+p.name,done:false,time:''}]:[])]),
 ...S.goals.filter(g=>g.deadline===d&&!g.done).map(g=>({k:'m',id:g.id+'dl',title:'Goal due: '+g.title,done:false,time:''}))];
const spentTotal=S=>sum(S.expenses.filter(e=>e.type==='expense').map(e=>e.amount));
const allocTotal=S=>sum(Object.values(S.alloc));
const unpaidAll=S=>sum(S.trips.flatMap(x=>x.bookings).filter(b=>!b.paid).map(b=>b.cost));

 <div className="grid2"><div className="col">

  <div className="card flush"><div className="shead" style=${{padding:'14px 16px 0'}}><h2>Today</h2><button className="btn sm soft" onClick=${()=>U.open('task',{date:T})}><${Ic} n="plus" s=${16}/> Add task</button></div>
   ${dueToday.length?html`<div className="list">${dueToday.map(t=>html`<${TaskRow} key=${t.id} t=${t} S=${S} A=${A} U=${U}/>`)}</div>`:html`<${Empty} t="A clear day" s="Nothing is due today. Add a task or ask the assistant."/>`}</div>
  ${S.habits.length?html`<div className="card"><div className="shead"><h2>Habits today</h2><button className="link" onClick=${()=>U.go('goals')}>Open</button></div>${S.habits.map(h=>html`<div key=${h.id} className="rowf small" style=${{justifyContent:'space-between',flexWrap:'nowrap',minHeight:44}}><span style=${{minWidth:0,overflowWrap:'anywhere'}}>${h.title} <span className="faint">· ${streak(h)} day streak</span></span><button className=${'btn sm '+(h.logs[T]?'soft':'')} aria-pressed=${!!h.logs[T]} onClick=${()=>A.toggleHabit(h.id,T)}>${h.logs[T]?'Done':'Check in'}</button></div>`)}</div>`:null}
  <div className="card"><div className="shead"><h2>Coming up</h2><button className="link" onClick=${()=>U.go('planner')}>Open planner</button></div>
   ${upcoming.length?html`<div className="stack" style=${{gap:'8px'}}>${upcoming.slice(0,6).map(x=>html`<div key=${x.k+x.id} className="rowf small"><span className=${'pill '+(x.k==='r'?'acc':(x.k==='i'||x.k==='m')?'warn':'pri')} style=${{minWidth:70,justifyContent:'center'}}>${rel(x.d)}</span><span style=${{flex:1,minWidth:0,overflowWrap:'anywhere'}}>${x.title}</span><span className="faint num">${x.time}</span></div>`)}</div>`:html`<p className="muted small">Nothing in the next 7 days.</p>`}</div>
 </div><div className="col">
  ${trip?html`<button className="tripcard" onClick=${()=>U.go('travel',trip.id)}><div className="rowf" style=${{justifyContent:'space-between'}}><h2 style=${{margin:0}}>${trip.name}</h2><span className="pill acc">${diff(trip.start,T)>0?diff(trip.start,T)+' days to go':'Under way'}</span></div>

 </div></div></div>`}

/* ---------- Assistant ---------- */
function Assistant({S,A,U,seedQ}){
 const [q,setQ]=useState('');const [busy,setBusy]=useState(false);const end=useRef();const first=useRef(true);
 const send=text=>{if(!text.trim()||busy)return;A.chat(m=>[...m,{id:uid(),role:'u',text}]);setBusy(true);
  setTimeout(()=>{const r=interpret(text,S);A.chat(m=>[...m,{id:uid(),role:'a',text:r.text,proposals:(r.proposals||[]).map(p=>({...p,id:uid(),status:'pending'}))}]);setBusy(false)},S.settings.reduceMotion?0:450)};
 useEffect(()=>{if(first.current&&seedQ){first.current=false;send(seedQ)}},[]);
 useEffect(()=>{if(end.current)end.current.scrollIntoView({block:'end'})},[S.chat.length,busy]);
 const setP=(mid,pid,patch)=>A.chat(ms=>ms.map(m=>m.id===mid?{...m,proposals:m.proposals.map(p=>p.id===pid?{...p,...patch}:p)}:m));
 const approve=(m,p)=>{const d=p.data;let cid;
  if(p.kind==='task')cid=A.addTask({...d,amount:d.amount||undefined},true);if(p.kind==='project')cid=A.addProject(d,true);
  if(p.kind==='tx')cid=A.addTx(d,true);if(p.kind==='reminder')cid=A.addReminder(d,true);setP(m.id,p.id,{status:'applied',cid})};
 const undo=(m,p)=>{if(p.kind==='task')A.deleteTask(p.cid,true);if(p.kind==='tx')A.deleteTx(p.cid,true);if(p.kind==='reminder')A.deleteReminder(p.cid,true);if(p.kind==='project')A.deleteProject(p.cid,true);setP(m.id,p.id,{status:'undone'})};
 const rows=p=>{const d=p.data,c=S.settings.currency;
  if(p.kind==='task')return [['Task',d.title],['Due',rel(d.due)],['Priority',d.priority==='high'?'High':'Normal']].concat(d.amount?[['Amount',money(d.amount,c)]]:[]).concat(d.project&&S.projects.find(x=>x.id===d.project)?[['Project',S.projects.find(x=>x.id===d.project).name]]:[]);
  if(p.kind==='project')return [['Project',d.name]].concat(d.deadline?[['Deadline',rel(d.deadline)]]:[]);
  if(p.kind==='tx')return [[d.type==='income'?'Income':'Expense',d.title],['Amount',money(d.amount,c)],['Category',d.cat],['Date',rel(d.date)]];
  return [['Reminder',d.title],['When',rel(d.date)+' at '+d.time],['Repeats',d.repeat==='none'?'No':d.repeat]]};
 const label={task:'Add task',tx:'Add transaction',reminder:'Set reminder',project:'Create project'};
 return html`<div className="stack"><div className="note">This assistant runs on simple rules inside this page. It is not connected to Claude or any server. The approval cards show how the real assistant will ask before it changes anything.</div>
  <div className="msgs" role="log" aria-live="polite">
   ${S.chat.map(m=>html`<${React.Fragment} key=${m.id}><div className=${'m '+m.role}>${m.text}</div>
    ${(m.proposals||[]).map(p=>html`<div key=${p.id} className=${'prop '+p.status}><div className="rowf" style=${{justifyContent:'space-between'}}><b><${Ic} n="spark" s=${16}/> ${label[p.kind]}</b>
      <span className=${'pill '+(p.status==='applied'?'ok':p.status==='pending'?'pri':'')}>${p.status==='pending'?'Needs your approval':p.status==='applied'?'Added':p.status==='undone'?'Undone':'Not added'}</span></div>
      <dl className="kv small">${rows(p).map(r=>html`<${React.Fragment} key=${r[0]}><dt>${r[0]}</dt><dd>${r[1]}</dd><//>`)}</dl>
      ${p.status==='pending'?html`<div className="rowf"><button className="btn pri sm" onClick=${()=>approve(m,p)}><${Ic} n="check" s=${16}/> Approve</button><button className="btn sm" onClick=${()=>setP(m.id,p.id,{status:'rejected'})}>Reject</button></div>`:null}
      ${p.status==='applied'?html`<button className="btn sm" onClick=${()=>undo(m,p)}><${Ic} n="undo" s=${16}/> Undo</button>`:null}</div>`)}<//>`)}
   ${busy?html`<div className="m a" aria-label="Assistant is thinking"><span className="think"><i></i><i></i><i></i></span></div>`:null}<div ref=${end}></div></div>
  <div className="compose"><div className="sugg" style=${{marginBottom:8}}>${["What's due today?","Add task buy gifts on friday","Spent £20 on lunch","Remind me to call Aunty tomorrow at 6pm","New project Spring clean","How much is left in my budget?"].map(s=>html`<button key=${s} className="chip" onClick=${()=>send(s)}>${s}</button>`)}</div>
   <form className="ask" onSubmit=${e=>{e.preventDefault();send(q);setQ('')}}><label className="sr" htmlFor="chatin">Message</label><input id="chatin" value=${q} onChange=${e=>setQ(e.target.value)} placeholder="Type a request"/><button className="btn pri sm" type="submit" disabled=${busy}><${Ic} n="send" s=${16}/> Send</button></form></div></div>`}

/* ---------- Planner ---------- */
function Planner({S,A,U}){
 const [view,setView]=useState('day');const [cur,setCur]=useState(today());const [flt,setFlt]=useState('open');
 const T=today(),ws=S.settings.weekStart;
 const step=n=>setCur(c=>view==='month'?iso(new Date(parse(c).getFullYear(),parse(c).getMonth()+n,1)):addDays(c,view==='week'?7*n:n));
 const title=view==='month'?fmt(cur,{month:'long',year:'numeric'}):view==='week'?fmt(startOfWeek(cur,ws),{day:'numeric',month:'short'})+' to '+fmt(addDays(startOfWeek(cur,ws),6),{day:'numeric',month:'short'}):fmt(cur,{weekday:'long',day:'numeric',month:'long'});
 const dayItems=d=>itemsOn(S,d).sort((a,b)=>(a.time||'99')<(b.time||'99')?-1:1);
 const Ev=({x})=>html`<div className=${'ev '+x.k+(x.done?' d':'')}>${x.time?x.time+' ':''}${x.title}</div>`;
 let body;
 if(view==='day'){const ts=S.tasks.filter(t=>t.due===cur),others=dayItems(cur).filter(x=>x.k!=='t');
  body=html`<div className="stack"><div className="card flush"><div className="shead" style=${{padding:'14px 16px 0'}}><h2>Tasks</h2><button className="btn sm soft" onClick=${()=>U.open('task',{date:cur})}><${Ic} n="plus" s=${16}/> Add task</button></div>
   ${ts.length?html`<div className="list">${ts.map(t=>html`<${TaskRow} key=${t.id} t=${t} S=${S} A=${A} U=${U}/>`)}</div>`:html`<${Empty} t="Nothing due" s="Add a task for this day."/>`}</div>
   <div className="card"><h2>Reminders and trip plans</h2>${others.length?html`<div className="stack" style=${{gap:'6px'}}>${others.map(x=>html`<${Ev} key=${x.k+x.id} x=${x}/>`)}</div>`:html`<p className="muted small">No reminders or trip plans on this day.</p>`}</div></div>`}
 else if(view==='week'){const s=startOfWeek(cur,ws);body=html`<div className="week">${Array.from({length:7},(_,i)=>addDays(s,i)).map(d=>html`<div key=${d} className=${'wcol'+(d===T?' today':'')}>
   <button className="link" style=${{textAlign:'left',padding:0,minHeight:28}} onClick=${()=>{setCur(d);setView('day')}}>${fmt(d,{weekday:'short',day:'numeric'})}</button>
   ${dayItems(d).map(x=>html`<${Ev} key=${x.k+x.id} x=${x}/>`)}${dayItems(d).length?null:html`<span className="cap faint">Free</span>`}</div>`)}</div>`}
 else if(view==='month'){const first=iso(new Date(parse(cur).getFullYear(),parse(cur).getMonth(),1)),s=startOfWeek(first,ws),mo=parse(cur).getMonth();
  const days=Array.from({length:42},(_,i)=>addDays(s,i));const names=Array.from({length:7},(_,i)=>fmt(addDays(s,i),{weekday:'short'}));
  body=html`<div className="cal">${names.map(n=>html`<div key=${n} className="dow">${n}</div>`)}${days.map(d=>{const its=itemsOn(S,d);return html`<button key=${d} className=${'cell'+(parse(d).getMonth()!==mo?' out':'')+(d===T?' today':'')} aria-pressed=${d===cur} aria-label=${fmt(d,{weekday:'long',day:'numeric',month:'long'})+', '+its.length+' items'} onClick=${()=>{setCur(d);setView('day')}}>
   <span className="dn">${parse(d).getDate()}</span><span className="dots">${its.slice(0,4).map((x,i)=>html`<i key=${i} className=${'dot '+(x.k==='r'?'r':(x.k==='i'||x.k==='m')?'t':'')}></i>`)}</span></button>`})}</div>
   <p className="cap muted" style=${{marginTop:8}}><span className="dot" style=${{display:'inline-block'}}></span> task &nbsp;<span className="dot r" style=${{display:'inline-block'}}></span> reminder &nbsp;<span className="dot t" style=${{display:'inline-block'}}></span> trip plan</p>`}
 else{const list=[...S.tasks].filter(t=>flt==='all'||(flt==='open'?!t.done:t.done)).sort((a,b)=>a.due<b.due?-1:1);
  body=html`<div className="stack"><div className="rowf">${[['open','Open'],['done','Done'],['all','All']].map(f=>html`<button key=${f[0]} className="chip" aria-pressed=${flt===f[0]} onClick=${()=>setFlt(f[0])}>${f[1]}</button>`)}
   <span className="sp"></span><button className="btn sm pri" onClick=${()=>U.open('task',{date:T})}><${Ic} n="plus" s=${16}/> Add task</button></div>
   <div className="card flush">${list.length?html`<div className="list">${list.map(t=>html`<${TaskRow} key=${t.id} t=${t} S=${S} A=${A} U=${U}/>`)}</div>`:html`<${Empty} t="Nothing here" s="Try another filter or add a task."/>`}</div></div>`}
 return html`<div className="stack" style=${{gap:'16px'}}>
  <div className="rowf" style=${{justifyContent:'space-between'}}><div role="tablist" className="tabs" aria-label="Planner view">${[['day','Day'],['week','Week'],['month','Month'],['tasks','Tasks']].map(v=>html`<button key=${v[0]} role="tab" className="tab" aria-selected=${view===v[0]} onClick=${()=>setView(v[0])}>${v[1]}</button>`)}</div></div>
  ${view!=='tasks'?html`<div className="rowf" style=${{justifyContent:'space-between'}}><div className="rowf"><button className="ibtn" aria-label="Previous" onClick=${()=>step(-1)}><${Ic} n="l"/></button><button className="ibtn" aria-label="Next" onClick=${()=>step(1)}><${Ic} n="r"/></button><button className="btn sm" onClick=${()=>setCur(T)}>Today</button></div><h2 style=${{margin:0}}>${title}</h2></div>`:null}
  ${body}</div>`}

/* ---------- Budget ---------- */

   <div className="card"><h2>Spending, last 14 days</h2><svg className="chart" viewBox="0 0 336 110" role="img" aria-label=${'Daily spending for the last 14 days, highest '+money(mx,cur)}>
     <line x1="0" y1="84" x2="336" y2="84"/>${by.map((v,i)=>html`<rect key=${i} className=${'b'+(i===13?' today':'')} x=${i*24+4} y=${84-v/mx*70} width="16" height=${Math.max(v>0?2:0,v/mx*70)} rx="3"><title>${fmt(days[i],{day:'numeric',month:'short'})}: ${money(v,cur)}</title></rect>`)}

/* ---------- Travel ---------- */
function Travel({S,A,U,sel,setSel}){
 const cur=S.settings.currency,T=today();const [tab,setTab]=useState('overview');const [ci,setCi]=useState('');

async function pdfText(blob){await loadScript(PDFJS);await loadScript(PDFW);const lib=window.pdfjsLib;try{lib.GlobalWorkerOptions.workerSrc=PDFW}catch(e){}

const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

 while((m=re.exec(t))){let y,mo,d;if(m[1]){y=+m[1];mo=+m[2];d=+m[3]}else if(m[4]){d=+m[4];mo=MON.indexOf(m[5].toLowerCase())+1;y=+m[6];if(y<100)y+=2000}else{d=+m[7];mo=+m[8];y=+m[9]}if(mo>=1&&mo<=12&&d>=1&&d<=31)out.push(y+'-'+pad(mo)+'-'+pad(d))}return out}

/* ---------- Projects ---------- */

 const cur=S.settings.currency,T=today();const [tab,setTab]=useState('overview');const [ft,setFt]=useState('active');const [nt,setNt]=useState('');const [nm,setNm]=useState('');const [nd,setNd]=useState('');const [conf,setConf]=useState(false);const [att,setAtt]=useState('');
 const p=S.projects.find(x=>x.id===sel);
 if(!p){const list=S.projects.filter(x=>x.status===ft);
  return html`<div className="stack"><div className="rowf" style=${{justifyContent:'space-between'}}><div className="rowf">${[['active','Active'],['done','Completed'],['archived','Archived']].map(f=>html`<button key=${f[0]} className="chip" aria-pressed=${ft===f[0]} onClick=${()=>setFt(f[0])}>${f[1]}</button>`)}</div><button className="btn pri" onClick=${()=>U.open('project')}><${Ic} n="plus" s=${18}/> New project</button></div>
   ${list.length?html`<div className="cardgrid">${list.map(x=>{const sp=pspent(S,x.id),pr=pprog(S,x);return html`<button key=${x.id} className="tripcard" onClick=${()=>{setSel(x.id);setTab('overview')}}>
     <div className="rowf" style=${{justifyContent:'space-between',flexWrap:'nowrap'}}><h2 style=${{margin:0}}>${x.name}</h2>${x.priority==='high'?html`<span className="pill acc">High</span>`:null}</div>
     ${x.desc?html`<div className="small muted" style=${{overflowWrap:'anywhere'}}>${x.desc.slice(0,110)}</div>`:null}<${Bar} v=${pr} max=${100}/>
     <div className="rowf cap muted num"><span>${pr}% done</span>${x.deadline?html`<span>· due ${rel(x.deadline)}</span>`:null}${x.budget?html`<span>· ${money(sp,cur)} of ${money(x.budget,cur)}</span>`:null}</div></button>`})}</div>`
   :html`<div className="card"><${Empty} t=${ft==='active'?'No active projects':'Nothing here'} s=${ft==='active'?'A project groups tasks, milestones, spending, reminders and files for one goal, like a wedding or a house move.':'Projects you '+(ft==='done'?'complete':'archive')+' appear here.'}/></div>`}</div>`}
 const tk=ptasks(S,p.id),top=tk.filter(t=>!t.parent),sp=pspent(S,p.id),pr=pprog(S,p),ms=[...(p.milestones||[])].sort((a,b)=>(a.date||'9')<(b.date||'9')?-1:1);
 const rems=S.reminders.filter(r=>r.project===p.id&&!r.done),docs=S.docs.filter(d=>d.project===p.id),spare=S.docs.filter(d=>d.project!==p.id);
 const pex=S.expenses.filter(e=>e.project===p.id).sort((a,b)=>a.date<b.date?1:-1);
 return html`<div className="stack" style=${{gap:'14px'}}>
  <div className="rowf" style=${{justifyContent:'space-between'}}><button className="btn sm" onClick=${()=>setSel(null)}><${Ic} n="l" s=${16}/> All projects</button><button className="btn sm" onClick=${()=>U.open('project',{edit:p.id})}>Edit details</button></div>
  <div><div className="rowf"><h1 className="disp" style=${{margin:0}}>${p.name}</h1><span className=${'pill '+(p.status==='done'?'ok':p.status==='archived'?'':'pri')}>${p.status==='done'?'Completed':p.status==='archived'?'Archived':'Active'}</span></div>${p.desc?html`<p className="muted" style=${{marginTop:4,overflowWrap:'anywhere'}}>${p.desc}</p>`:null}</div>
  <div className="rowf">${p.status==='active'?html`<button className="btn sm pri" onClick=${()=>{A.updProject(p.id,{status:'done'});U.toast('Project marked completed')}}><${Ic} n="check" s=${16}/> Mark completed</button><button className="btn sm" onClick=${()=>{A.updProject(p.id,{status:'archived'});U.toast('Project archived')}}>Archive</button>`
   :html`<button className="btn sm" onClick=${()=>{A.updProject(p.id,{status:'active'});U.toast('Project reopened')}}>${p.status==='done'?'Reopen':'Restore'}</button>${p.status==='done'?html`<button className="btn sm" onClick=${()=>A.updProject(p.id,{status:'archived'})}>Archive</button>`:null}`}
   ${!conf?html`<button className="btn sm danger" onClick=${()=>setConf(true)}>Delete</button>`:html`<button className="btn sm danger" onClick=${()=>{A.deleteProject(p.id);setSel(null)}}>Yes, delete project</button><button className="btn sm" onClick=${()=>setConf(false)}>Keep</button>`}</div>
  <div role="tablist" className="tabs">${[['overview','Overview'],['tasks','Tasks'],['milestones','Milestones'],['money','Money'],['notes','Notes'],['files','Files']].map(v=>html`<button key=${v[0]} role="tab" className="tab" aria-selected=${tab===v[0]} onClick=${()=>setTab(v[0])}>${v[1]}</button>`)}</div>
  ${tab==='overview'?html`<div className="card stack"><div className="stat"><div><div className="cap muted">Progress</div><div className="v">${pr}%</div></div><div><div className="cap muted">Deadline</div><div className="v" style=${{fontSize:'1rem'}}>${p.deadline?rel(p.deadline):'None set'}</div></div>
    <div><div className="cap muted">Tasks done</div><div className="v">${tk.filter(t=>t.done).length} of ${tk.length}</div></div><div><div className="cap muted">Spent</div><div className="v">${money(sp,cur)}${p.budget?html`<span className="cap muted"> of ${money(p.budget,cur)}</span>`:null}</div></div></div>
    <${Bar} v=${pr} max=${100}/><div className="cap muted">${p.start?'Started '+rel(p.start)+'. ':''}${p.priority==='high'?'High priority.':p.priority==='low'?'Low priority.':'Normal priority.'}</div></div>
   <div className="card"><div className="shead"><h2>Reminders</h2><button className="btn sm soft" onClick=${()=>U.open('reminder',{project:p.id})}><${Ic} n="plus" s=${16}/> Add</button></div>
    ${rems.length?rems.map(r=>html`<div key=${r.id} className="rowf small" style=${{justifyContent:'space-between'}}><span>${r.title}</span><span className="pill warn">${rel(r.date)} ${r.time}</span></div>`):html`<p className="small muted">No reminders for this project.</p>`}</div>`:null}
  ${tab==='tasks'?html`<div className="card flush"><form className="rowf" style=${{padding:12,flexWrap:'nowrap'}} onSubmit=${e=>{e.preventDefault();if(!nt.trim())return;A.addTask({title:nt.trim(),due:p.deadline&&p.deadline>=T?p.deadline:T,project:p.id},true);setNt('')}}>
    <label className="sr" htmlFor="ptask">New task for this project</label><input id="ptask" className="in" style=${{flex:1,minWidth:0}} value=${nt} onChange=${e=>setNt(e.target.value)} placeholder="Add a task"/><button className="btn pri" type="submit">Add</button></form>
   ${top.length?html`<div className="list">${top.map(t=>html`<${React.Fragment} key=${t.id}><${TaskRow} t=${t} S=${S} A=${A} U=${U}/>${tk.filter(c=>c.parent===t.id).map(c=>html`<div key=${c.id} className="nested"><${TaskRow} t=${c} S=${S} A=${A} U=${U}/></div>`)}
     <div className="nested" style=${{padding:'0 14px 8px'}}><button className="link" onClick=${()=>U.open('task',{project:p.id,parent:t.id,date:t.due})}>+ Add subtask</button></div><//>`)}</div>`:html`<${Empty} t="No tasks yet" s="Add the first step above."/>`}</div>`:null}
  ${tab==='milestones'?html`<div className="card flush"><form className="rowf" style=${{padding:12}} onSubmit=${e=>{e.preventDefault();if(!nm.trim())return;A.projF(p.id,x=>({...x,milestones:[...x.milestones,{id:uid(),title:nm.trim(),date:nd,done:false}]}));setNm('');setNd('')}}>
    <label className="sr" htmlFor="pms">Milestone</label><input id="pms" className="in" style=${{flex:'1 1 160px',minWidth:0}} value=${nm} onChange=${e=>setNm(e.target.value)} placeholder="Milestone, for example Venue booked"/>
    <label className="sr" htmlFor="pmd">Milestone date</label><input id="pmd" className="in" style=${{flex:'0 1 150px'}} type="date" value=${nd} onChange=${e=>setNd(e.target.value)}/><button className="btn pri" type="submit">Add</button></form>
   ${ms.length?html`<div className="list">${ms.map(m=>html`<div key=${m.id} className=${'item'+(m.done?' done':'')}><button className="tickwrap" role="checkbox" aria-checked=${m.done} aria-label=${m.title} onClick=${()=>A.projF(p.id,x=>({...x,milestones:x.milestones.map(y=>y.id===m.id?{...y,done:!y.done}:y)}))}><span className="tick" aria-checked=${m.done}><${Ic} n="check" s=${16}/></span></button>
     <div className="body"><div className="tt">${m.title}</div>${m.date?html`<div className="cap muted">${rel(m.date)}</div>`:null}</div><button className="ibtn sm" aria-label=${'Remove '+m.title} onClick=${()=>A.projF(p.id,x=>({...x,milestones:x.milestones.filter(y=>y.id!==m.id)}))}><${Ic} n="x" s=${16}/></button></div>`)}</div>`:html`<${Empty} t="No milestones" s="Milestones mark the big checkpoints on the way to the deadline."/>`}</div>`:null}
  ${tab==='money'?html`<div className="stack"><div className="card"><div className="stat"><div><div className="cap muted">Project budget</div><div className="v">${money(p.budget||0,cur)}</div></div><div><div className="cap muted">Spent</div><div className="v">${money(sp,cur)}</div></div>
    <div><div className="cap muted">${p.budget-sp<0?'Over by':'Left'}</div><div className="v" style=${{color:p.budget-sp<0?'var(--err)':'var(--ok)'}}>${money(Math.abs((p.budget||0)-sp),cur)}</div></div></div>${p.budget?html`<div style=${{marginTop:12}}><${Bar} v=${sp} max=${p.budget} over=${sp>p.budget}/></div>`:html`<p className="small muted" style=${{marginTop:10}}>Set a budget under Edit details to track spending against it.</p>`}</div>
   <div className="card flush"><div className="shead" style=${{padding:'14px 16px 0'}}><h2>Transactions</h2><button className="btn sm soft" onClick=${()=>U.open('tx',{project:p.id})}><${Ic} n="plus" s=${16}/> Add</button></div>
    ${pex.length?html`<div className="list">${pex.map(e=>html`<div key=${e.id} className="item"><div className="body"><div className="tt">${e.title}</div><div className="cap muted">${rel(e.date)} · ${e.cat}</div></div><span className=${'amt '+(e.type==='income'?'pos':'')}>${e.type==='income'?'+':'−'}${money(e.amount,cur).replace('−','')}</span></div>`)}</div>`:html`<${Empty} t="No spending yet" s="Spending added to this project shows up here and in your budget."/>`}</div></div>`:null}
  ${tab==='notes'?html`<div className="card stack"><label htmlFor="pnotes" className="small" style=${{fontWeight:500}}>Notes (saved as you type)</label><textarea id="pnotes" className="in" style=${{minHeight:220,padding:12}} value=${p.notes||''} onChange=${e=>A.updProject(p.id,{notes:e.target.value})} placeholder="Ideas, contacts, decisions"></textarea></div>`:null}
  ${tab==='files'?html`<div className="stack"><div className="card flush">${docs.length?html`<div className="list">${docs.map(d=>html`<div key=${d.id} className="item"><${Ic} n="file"/><div className="body"><div className="tt">${docTitle(d)}</div><div className="cap muted">${(DT.find(x=>x[0]===d.type)||[])[1]} · ${d.status==='verified'?'Verified':'Needs review'}</div></div><button className="btn sm" onClick=${()=>U.open('doc',{id:d.id})}>Open</button><button className="ibtn sm" aria-label="Detach" onClick=${()=>A.updDoc(d.id,{project:''})}><${Ic} n="x" s=${16}/></button></div>`)}</div>`:html`<${Empty} t="No files attached" s="Attach tickets, invoices and receipts to keep them with this project."/>`}</div>
   <div className="card stack"><div className="field"><label htmlFor="attdoc">Attach an existing document</label><select id="attdoc" className="in" value=${att} onChange=${e=>setAtt(e.target.value)}><option value="">Choose a document</option>${spare.map(d=>html`<option key=${d.id} value=${d.id}>${docTitle(d)}</option>`)}</select></div>
    <div className="rowf"><button className="btn" disabled=${!att} onClick=${()=>{A.updDoc(att,{project:p.id});setAtt('')}}>Attach</button><button className="btn" onClick=${()=>U.go('documents')}>Upload a new document</button></div></div></div>`:null}</div>`}

/* ---------- Goals and habits ---------- */
function Goals({S,A,U}){
 const T=today(),ws=S.settings.weekStart;const [tab,setTab]=useState('goals');const [ms,setMs]=useState({});
 const last7=Array.from({length:7},(_,i)=>addDays(T,i-6)),ach=achievements(S);
 return html`<div className="stack" style=${{gap:'14px'}}><div role="tablist" className="tabs">${[['goals','Goals'],['habits','Habits'],['ach','Achievements']].map(v=>html`<button key=${v[0]} role="tab" className="tab" aria-selected=${tab===v[0]} onClick=${()=>setTab(v[0])}>${v[1]}</button>`)}</div>
 ${tab==='goals'?html`<div className="stack"><div><button className="btn pri" onClick=${()=>U.open('goal')}><${Ic} n="plus" s=${18}/> New goal</button></div>
  ${S.goals.length?S.goals.map(g=>{const p=gpct(g),days=g.deadline?diff(g.deadline,T):null;return html`<div key=${g.id} className="card stack">
   <div className="rowf" style=${{justifyContent:'space-between',flexWrap:'nowrap'}}><h2 style=${{margin:0,overflowWrap:'anywhere'}}>${g.title}</h2>${g.done||p>=100?html`<span className="pill ok">Reached</span>`:days!=null?html`<span className=${'pill '+(days<0?'err':'acc')}>${days<0?'Past deadline':days===0?'Due today':days+' days left'}</span>`:null}</div>
   ${g.why?html`<div className="small muted">${g.why}</div>`:null}
   <div className="num"><b>${g.current.toLocaleString('en-GB')}</b> <span className="muted">of ${g.target.toLocaleString('en-GB')} ${g.unit} · ${Math.round(p)}%</span></div><${Bar} v=${p} max=${100}/>
   <div className="rowf"><button className="btn sm pri" onClick=${()=>U.open('logprog',{id:g.id})}><${Ic} n="plus" s=${16}/> Log progress</button>${!g.done&&p<100?html`<button className="btn sm" onClick=${()=>A.goalF(g.id,x=>({...x,done:true}))}>Mark reached</button>`:null}<button className="btn sm" onClick=${()=>A.deleteGoal(g.id)}>Delete</button></div>
   <div><h3 className="small" style=${{marginBottom:4}}>Milestones</h3>${(g.milestones||[]).map(m=>html`<div key=${m.id} className=${'rowf small'+(m.done?' faint':'')} style=${{flexWrap:'nowrap'}}><button className="tickwrap" role="checkbox" aria-checked=${m.done} aria-label=${m.title} onClick=${()=>A.goalF(g.id,x=>({...x,milestones:x.milestones.map(y=>y.id===m.id?{...y,done:!y.done}:y)}))}><span className="tick" aria-checked=${m.done}><${Ic} n="check" s=${16}/></span></button><span style=${{flex:1,textDecoration:m.done?'line-through':'none'}}>${m.title}</span></div>`)}
    <form className="rowf" style=${{flexWrap:'nowrap',marginTop:4}} onSubmit=${e=>{e.preventDefault();const v=(ms[g.id]||'').trim();if(!v)return;A.goalF(g.id,x=>({...x,milestones:[...(x.milestones||[]),{id:uid(),title:v,done:false}]}));setMs({...ms,[g.id]:''})}}><label className="sr" htmlFor=${'gm-'+g.id}>New milestone</label><input id=${'gm-'+g.id} className="in" style=${{minWidth:0,flex:1}} placeholder="Add a milestone" value=${ms[g.id]||''} onChange=${e=>setMs({...ms,[g.id]:e.target.value})}/><button className="btn sm" type="submit">Add</button></form></div>
   ${(g.log||[]).length?html`<details><summary className="small" style=${{cursor:'pointer',minHeight:32}}>Progress history (${g.log.length})</summary>${[...g.log].reverse().map(l=>html`<div key=${l.id} className="rowf cap muted num" style=${{justifyContent:'space-between'}}><span>${rel(l.date)}</span><span>${l.delta>=0?'+':''}${l.delta} ${g.unit} → ${l.total}</span></div>`)}</details>`:null}</div>`})
  :html`<div className="card"><${Empty} t="No goals yet" s="Set a target with a deadline, then log progress as you go."/></div>`}</div>`:null}
 ${tab==='habits'?html`<div className="stack"><div><button className="btn pri" onClick=${()=>U.open('habit')}><${Ic} n="plus" s=${18}/> New habit</button></div>
  ${S.habits.length?S.habits.map(h=>{const g=S.goals.find(x=>x.id===h.goal),wc=weekCount(h,ws);return html`<div key=${h.id} className="card stack">
   <div className="rowf" style=${{justifyContent:'space-between',flexWrap:'nowrap'}}><div style=${{minWidth:0}}><h2 style=${{margin:0,overflowWrap:'anywhere'}}>${h.title}</h2><div className="cap muted">${h.perWeek===7?'Every day':h.perWeek+' days a week'}${g?' · for '+g.title:''}</div></div>
    <button className=${'btn '+(h.logs[T]?'soft':'pri')} aria-pressed=${!!h.logs[T]} onClick=${()=>A.toggleHabit(h.id,T)}>${h.logs[T]?html`<${Ic} n="check" s=${18}/> Done today`:'Check in'}</button></div>
   <div className="rowf" role="group" aria-label=${'Last 7 days for '+h.title} style=${{gap:6}}>${last7.map(d=>html`<button key=${d} className="chip" style=${{minWidth:44,justifyContent:'center',flexDirection:'column',gap:0,padding:'4px 6px',height:'auto'}} aria-pressed=${!!h.logs[d]} aria-label=${fmt(d,{weekday:'long',day:'numeric',month:'short'})+(h.logs[d]?', done':', not done')} onClick=${()=>A.toggleHabit(h.id,d)}><span className="cap">${fmt(d,{weekday:'short'}).slice(0,2)}</span><span>${h.logs[d]?'✓':'·'}</span></button>`)}</div>
   <div className="rowf small muted num"><span><b>${streak(h)}</b> day streak</span><span>· best ${bestStreak(h)}</span><span>· ${wc} of ${h.perWeek} this week</span><span>· ${Object.keys(h.logs).length} total</span></div><${Bar} v=${wc} max=${h.perWeek}/>
   <div><button className="btn sm" onClick=${()=>A.deleteHabit(h.id)}>Delete habit</button></div></div>`}):html`<div className="card"><${Empty} t="No habits yet" s="Pick something small to do often, and check in each day."/></div>`}</div>`:null}
 ${tab==='ach'?html`<div className="cardgrid">${ach.map(a=>html`<div key=${a.t} className="card" style=${{opacity:a.v>=a.m?1:.8}}><div className="rowf" style=${{justifyContent:'space-between',flexWrap:'nowrap'}}><h3 style=${{margin:0}}>${a.t}</h3>${a.v>=a.m?html`<span className="pill ok"><${Ic} n="check" s=${12}/> Earned</span>`:html`<span className="pill">Locked</span>`}</div><div className="small muted" style=${{margin:'4px 0 8px'}}>${a.d}</div><${Bar} v=${Math.min(a.v,a.m)} max=${a.m}/><div className="cap muted num" style=${{marginTop:4}}>${Math.min(a.v,a.m)} of ${a.m}</div></div>`)}</div>`:null}</div>`}

/* ---------- Documents ---------- */
function Documents({S,A,U}){
 const [busy,setBusy]=useState(false);
 const onFile=async e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
  if(!(f.type==='application/pdf'||f.type.startsWith('image/'))){U.toast('Choose a PDF or a photo');return}
  if(f.size>15*1048576){U.toast('That file is over 15 MB');return}
  setBusy(true);const id=uid();try{await fput(id,f);A.addDoc({id,name:f.name||'Scanned document',mime:f.type,size:f.size,added:today(),type:'other',status:'new',fields:{},project:''});U.open('doc',{id});if(SB&&UID)remoteUpload(id,f).then(()=>A.updDoc(id,{remote:true})).catch(()=>U.toast('Saved here. Cloud upload will retry.'))}catch(err){U.toast("This browser couldn't store the file. Private browsing can block file storage.")}setBusy(false)};
 const docs=[...S.docs].sort((a,b)=>a.added<b.added?1:-1);
 return html`<div className="stack"><div className="note">Files are stored on this device only, inside this browser. PDFs are read here to suggest details. Photos are stored and shown, but reading text from photos needs an OCR service, which comes with the backend. You always check the details before anything is saved to your budget or trips.</div>
  <div className="rowf"><label className="btn pri" style=${{cursor:'pointer'}}><${Ic} n="upload" s=${18}/> Upload PDF or photo<input className="sr" type="file" id="updoc" accept="application/pdf,image/*" onChange=${onFile}/></label>
   <label className="btn" style=${{cursor:'pointer'}}><${Ic} n="camera" s=${18}/> Scan with camera<input className="sr" type="file" id="scandoc" accept="image/*" capture="environment" onChange=${onFile}/></label>${busy?html`<span className="small muted">Saving…</span>`:null}</div>
  <div className="card flush">${docs.length?html`<div className="list">${docs.map(d=>html`<div key=${d.id} className="item"><${Ic} n="file"/><div className="body"><div className="tt">${docTitle(d)}</div><div className="rowf cap muted" style=${{gap:6}}><span>${(DT.find(x=>x[0]===d.type)||[])[1]}</span><span>${kb(d.size)}</span><span>${rel(d.added)}</span><span className=${'pill '+(d.status==='verified'?'ok':'warn')}>${d.status==='verified'?'Verified':'Needs review'}</span></div></div>
   <button className="btn sm" onClick=${()=>U.open('doc',{id:d.id})}>${d.status==='verified'?'Open':'Review'}</button><button className="ibtn sm" aria-label=${'Delete '+d.name} onClick=${()=>A.deleteDoc(d.id)}><${Ic} n="trash" s=${18}/></button></div>`)}</div>`:html`<${Empty} t="No documents yet" s="Upload a flight ticket, hotel confirmation, invoice or receipt to get started."/>`}</div></div>`}

function DocSheet({id,S,A,U,close}){
 const d=S.docs.find(x=>x.id===id);const cur=S.settings.currency;
 const [type,setType]=useState(d?d.type:'other'),[url,setUrl]=useState(''),[busy,setBusy]=useState(false),[note,setNote]=useState(''),[trip,setTrip]=useState(S.trips[0]?S.trips[0].id:''),[amt,setAmt]=useState('');
 useEffect(()=>{let u,dead=false;fget(id).then(b=>{if(b&&!dead){u=URL.createObjectURL(b);setUrl(u)}}).catch(()=>{});return()=>{dead=true;if(u)URL.revokeObjectURL(u)}},[id]);
 useEffect(()=>{if(!d||d.tried)return;let dead=false;(async()=>{
  if(d.mime==='application/pdf'){setBusy(true);try{const b=await fget(id);const g=guessDoc(await pdfText(b));if(dead)return;A.updDoc(id,{tried:true,type:g.type,fields:g.fields,extracted:'pdf'});setType(g.type);setNote(g.found?'Suggested from the PDF text. Check every field before saving.':'The PDF has little readable text. Enter the details by hand.')}
   catch(e){if(!dead){A.updDoc(id,{tried:true,extracted:'failed'});setNote("I couldn't read this PDF in the browser. Enter the details by hand.")}}if(!dead)setBusy(false)}
  else{A.updDoc(id,{tried:true,extracted:'none'});setNote('Reading text from photos needs an OCR service, which comes with the backend. Enter the details by hand from the preview.')}})();return()=>{dead=true}},[id]);
 if(!d)return null;const f=d.fields||{},ver=d.status==='verified';
 const addFlight=()=>{const its=[{id:uid(),date:f.depDate,time:f.depTime||'00:00',title:(f.airline?f.airline+' ':'')+(f.flightNo||'Flight')+': '+(f.from||'?')+' to '+(f.to||'?')}];if(f.arrDate&&f.arrTime)its.push({id:uid(),date:f.arrDate,time:f.arrTime,title:'Arrive '+(f.to||'')});
  if(!f.depDate){U.toast('Add a departure date first');return}A.updTrip(trip,t=>({...t,itinerary:[...t.itinerary,...its]}));A.updDoc(id,{used:'itinerary',trip});U.toast('Flight added to the itinerary')};

 return html`<div className="stack" style=${{gap:'14px'}}><div role="tablist" className="tabs">${[['discover','Discover'],['saved','Saved ('+S.places.length+')']].map(v=>html`<button key=${v[0]} role="tab" className="tab" aria-selected=${tab===v[0]} onClick=${()=>setTab(v[0])}>${v[1]}</button>`)}</div>

/* ---------- Milestone 3: accounts, cloud database and file storage (Supabase) ---------- */
const SBJS='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
let SB=null,UID=null;
const COLL=['tasks','expenses','reminders','trips','projects','goals','habits','docs','places'];
const DEF_ALLOC={Flights:0,Stay:0,Transport:0,Food:0,'Gifts & shopping':0,Outfits:0,Other:0};
function jwtRole(k){try{return JSON.parse(atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).role}catch(e){return null}}
function cfgOk(c){return !!c&&!/^sb_secret_/.test(c.key||'')&&/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/.test(c.url||'')&&typeof c.key==='string'&&c.key.length>20&&jwtRole(c.key)!=='service_role'}
function getCfg(){const w=window.LIFELYN_CONFIG;let c=w?{url:w.supabaseUrl,key:w.supabaseAnonKey}:null;if(!cfgOk(c)){try{c=JSON.parse(localStorage.getItem('lifelyn-cfg'))}catch(e){c=null}}return cfgOk(c)?{url:c.url.replace(/\/$/,''),key:c.key}:null}
const remoteUpload=async(id,b)=>{const r=await SB.storage.from('lifelyn-documents').upload(UID+'/'+id,b,{upsert:true,contentType:b.type||'application/octet-stream'});if(r.error)throw r.error};
const remoteDownload=async id=>{const r=await SB.storage.from('lifelyn-documents').download(UID+'/'+id);if(r.error)throw r.error;return r.data};
const remoteRemove=async id=>{const r=await SB.storage.from('lifelyn-documents').remove([UID+'/'+id]);if(r.error)throw r.error};
const fclear=()=>new Promise(res=>{try{const r=indexedDB.deleteDatabase('lifelyn-files');r.onsuccess=r.onerror=r.onblocked=()=>res()}catch(e){res()}});
function applyRows(s,rows){const n={...s};for(const r of rows){if(r.kind==='alloc'){if(!r.deleted)n.alloc=r.data;continue}if(!COLL.includes(r.kind))continue;const arr=n[r.kind]||[];
 if(r.deleted)n[r.kind]=arr.filter(x=>String(x.id)!==r.id);else{const i=arr.findIndex(x=>String(x.id)===r.id);n[r.kind]=i>=0?arr.map((x,j)=>j===i?r.data:x):[...arr,r.data]}}return n}
const canonProfile=(p,tz)=>{const pr=p.prefs||{},nf=pr.notif||{};return {display_name:p.display_name||'',currency:p.currency||'GBP',week_start:p.week_start==null?1:p.week_start,theme:p.theme||'system',timezone:p.timezone||tz||'UTC',prefs:{reduceMotion:!!pr.reduceMotion,notif:{reminders:nf.reminders!==false,digest:!!nf.digest,assistant:nf.assistant!==false}}}};
const profileOf=s=>canonProfile({display_name:s.name,currency:s.currency,week_start:s.weekStart,theme:s.theme,prefs:{reduceMotion:s.reduceMotion,notif:s.notif}},(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return 'UTC'}})());
const settingsOf=p=>({name:p.display_name,currency:p.currency,weekStart:p.week_start,theme:p.theme,reduceMotion:p.prefs.reduceMotion,notif:p.prefs.notif});
/* Two-way sync of per-user records. Remote changes never overwrite unsynced local edits; local edits are pushed afterwards. */
function makeSync(sb,uid,getS,applyRemote,getSettings,setSettings,store){
 const sk='lifelyn-sync-'+uid;let snap=new Map(),since=null,prof=null,running=false;
 const st=store||{get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
 try{const j=JSON.parse(st.get(sk)||'null');if(j){snap=new Map(j.snap);since=j.since||null;prof=j.prof||null}}catch(e){}
 if(!snap.has('alloc:main'))snap.set('alloc:main',JSON.stringify(DEF_ALLOC));
 const save=()=>st.set(sk,JSON.stringify({snap:[...snap],since,prof}));
 const flat=()=>{const S=getS(),m=new Map();COLL.forEach(k=>(S[k]||[]).forEach(x=>m.set(k+':'+x.id,{kind:k,id:String(x.id),data:x})));m.set('alloc:main',{kind:'alloc',id:'main',data:S.alloc||{}});return m};
 async function pull(){for(let g=0;g<40;g++){let q=sb.from('lifelyn_records').select('kind,id,data,deleted,updated_at').order('updated_at',{ascending:true}).limit(500);if(since)q=q.gte('updated_at',since);
   const r=await q;if(r.error)throw r.error;const rows=r.data||[];if(!rows.length)return;const cur=flat(),take=[];
   for(const row of rows){const key=row.kind+':'+row.id,loc=cur.get(key),lj=loc?JSON.stringify(loc.data):undefined,sj=snap.get(key),rj=row.deleted?undefined:JSON.stringify(row.data);
    if(lj!==sj)continue;if(rj===lj){continue}take.push(row);if(rj===undefined)snap.delete(key);else snap.set(key,rj)}
   if(take.length)applyRemote(take);const last=rows[rows.length-1].updated_at;const stuck=last===since&&rows.length>=500;since=last;if(rows.length<500||stuck)return}}
 async function push(){const cur=flat(),ups=[];for(const [k,v] of cur){const j=JSON.stringify(v.data);if(snap.get(k)!==j)ups.push({k,j,row:{user_id:uid,kind:v.kind,id:v.id,data:v.data,deleted:false}})}
  for(const k of [...snap.keys()])if(!cur.has(k)){const i=k.indexOf(':');ups.push({k,j:undefined,row:{user_id:uid,kind:k.slice(0,i),id:k.slice(i+1),data:{},deleted:true}})}
  for(let i=0;i<ups.length;i+=200){const ch=ups.slice(i,i+200);const r=await sb.from('lifelyn_records').upsert(ch.map(x=>x.row),{onConflict:'user_id,kind,id'});if(r.error)throw r.error;ch.forEach(x=>{if(x.j===undefined)snap.delete(x.k);else snap.set(x.k,x.j)})}return ups.length}
 async function pullProfile(){const r=await sb.from('lifelyn_profiles').select('display_name,currency,week_start,theme,timezone,prefs').eq('id',uid).maybeSingle();if(r.error)throw r.error;if(!r.data)return;
  const loc=JSON.stringify(profileOf(getSettings())),rem=canonProfile(r.data),rj=JSON.stringify(rem);if(prof===null||loc===prof){if(rj!==loc)setSettings(settingsOf(rem));prof=rj}}
 async function pushProfile(){const loc=profileOf(getSettings()),lj=JSON.stringify(loc);if(lj===prof)return false;const r=await sb.from('lifelyn_profiles').upsert({id:uid,...loc},{onConflict:'id'});if(r.error)throw r.error;prof=lj;return true}
 async function sync(){if(running)return;running=true;try{await pullProfile();await pull();await push();await pushProfile();save()}finally{running=false}}
